services:
  caddy:
    build: ./
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"          # HTTP/3
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv:ro       # fingerprints.json, written by etl
      - caddy_data:/data       # ACME certificates
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
